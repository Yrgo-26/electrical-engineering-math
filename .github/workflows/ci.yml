# Set pipeline name.
name: CI

# Set pipeline triggers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Define pipeline jobs.
jobs:
  # Check code formatting with clang-format 18. The runner is pinned to Ubuntu 24.04, whose
  # package repository provides clang-format-18, so the version doesn't change when
  # ubuntu-latest moves to a newer release.
  format-check:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: bash ci/format.sh --check